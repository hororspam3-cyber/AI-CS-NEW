<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AI-CS New - Dashboard Company</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111827;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 240px;
      background: #111827;
      color: white;
      padding: 25px 18px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 35px;
    }

    .menu {
      display: block;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 8px;
      color: #d1d5db;
      text-decoration: none;
    }

    .menu:hover {
      background: #1f2937;
      color: white;
    }

    .menu.active {
      background: #374151;
      color: white;
    }

    .main {
      margin-left: 240px;
      padding: 30px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      gap: 20px;
    }

    .top h1 {
      margin: 0;
      font-size: 25px;
    }

    .top p {
      margin-bottom: 0;
      color: #6b7280;
    }

    .company-button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    .company-button:hover {
      background: #374151;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .card-title {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 25px;
      font-weight: bold;
    }

    .section {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .section h2 {
      margin-top: 0;
      font-size: 18px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 14px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
    }

    th {
      color: #6b7280;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #dcfce7;
      color: #166534;
      font-size: 12px;
    }

    .widget-button {
      padding: 8px 12px;
      border: none;
      border-radius: 7px;
      background: #111827;
      color: white;
      cursor: pointer;
      font-size: 12px;
    }

    .widget-button:hover {
      background: #374151;
    }

    .empty {
      text-align: center;
      padding: 35px;
      color: #6b7280;
    }

    @media (max-width: 800px) {

      .sidebar {
        position: static;
        width: 100%;
        height: auto;
      }

      .main {
        margin-left: 0;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .top {
        align-items: flex-start;
        flex-direction: column;
      }

      .section {
        overflow-x: auto;
      }

      table {
        min-width: 750px;
      }

    }

  </style>

</head>


<body>


  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="logo">
      🤖 AI-CS New
    </div>

    <a
      href="dashboard.html"
      class="menu active"
    >
      Dashboard
    </a>

    <a
      href="dashboard.html"
      class="menu"
    >
      Companies
    </a>

    <a
      href="widget-generator.html"
      class="menu"
    >
      Widget
    </a>

    <a
      href="#"
      class="menu"
      onclick="alert('API akan kita buat pada tahap berikutnya.'); return false;"
    >
      API
    </a>

  </aside>


  <!-- MAIN -->

  <main class="main">


    <div class="top">

      <div>

        <h1>
          Dashboard Company
        </h1>

        <p>
          Kelola perusahaan yang menggunakan AI-CS New.
        </p>

      </div>

      <button
        class="company-button"
        type="button"
        onclick="addCompany()"
      >
        + Tambah Company
      </button>

    </div>


    <!-- STATISTICS -->

    <div class="cards">

      <div class="card">

        <div class="card-title">
          Total Company
        </div>

        <div
          class="card-value"
          id="totalCompany"
        >
          0
        </div>

      </div>


      <div class="card">

        <div class="card-title">
          Company Aktif
        </div>

        <div
          class="card-value"
          id="activeCompany"
        >
          0
        </div>

      </div>


      <div class="card">

        <div class="card-title">
          Widget Aktif
        </div>

        <div
          class="card-value"
          id="activeWidget"
        >
          0
        </div>

      </div>

    </div>


    <!-- COMPANY TABLE -->

    <div class="section">

      <h2>
        Daftar Company
      </h2>

      <table>

        <thead>

          <tr>

            <th>
              Company ID
            </th>

            <th>
              Nama
            </th>

            <th>
              API URL
            </th>

            <th>
              Status
            </th>

            <th>
              Widget
            </th>

            <th>
              Aksi
            </th>

          </tr>

        </thead>

        <tbody
          id="companyTable"
        >

          <tr>

            <td
              colspan="6"
              class="empty"
            >
              Memuat data company...
            </td>

          </tr>

        </tbody>

      </table>

    </div>


  </main>


  <script>

    /*
    ========================================
    TAMBAH COMPANY
    ========================================
    */

    function addCompany() {

      window.location.href =
        "admin.html";

    }


    /*
    ========================================
    BUKA WIDGET
    ========================================
    */

    function openWidget(companyId) {

      window.location.href =
        "widget-generator.html?companyId=" +
        encodeURIComponent(companyId);

    }


    /*
    ========================================
    LOAD COMPANY
    ========================================
    */

    async function loadCompanies() {

      const table =
        document.getElementById(
          "companyTable"
        );

      try {

        const response =
          await fetch(
            "/api/companies"
          );

        const data =
          await response.json();

        if (
          !response.ok ||
          !data.success
        ) {

          throw new Error(
            data.message ||
            "Gagal mengambil data company."
          );

        }


        const companies =
          data.companies || [];


        document.getElementById(
          "totalCompany"
        ).textContent =
          companies.length;


        document.getElementById(
          "activeCompany"
        ).textContent =
          companies.filter(
            function(company) {

              return (
                company.api_enabled === true
              );

            }
          ).length;


        document.getElementById(
          "activeWidget"
        ).textContent =
          companies.filter(
            function(company) {

              return (
                company.widget === true ||
                company.widget === "Aktif"
              );

            }
          ).length;


        table.innerHTML = "";


        if (companies.length === 0) {

          table.innerHTML = `
            <tr>
              <td
                colspan="6"
                class="empty"
              >
                Belum ada data company.
              </td>
            </tr>
          `;

          return;
        }


        companies.forEach(
          function(company) {

            const row =
              document.createElement(
                "tr"
              );


            const widgetActive =
              company.widget === true ||
              company.widget === "Aktif";


            row.innerHTML = `

              <td>
                ${escapeHtml(
                  company.id || "-"
                )}
              </td>

              <td>
                ${escapeHtml(
                  company.name || "-"
                )}
              </td>

              <td>
                ${escapeHtml(
                  company.api_url || "-"
                )}
              </td>

              <td>
                <span class="status">
                  ${
                    company.api_enabled === true
                      ? "Aktif"
                      : "Nonaktif"
                  }
                </span>
              </td>

              <td>
                <span class="status">
                  ${
                    widgetActive
                      ? "Aktif"
                      : "Belum"
                  }
                </span>
              </td>

              <td>

                <button
                  class="widget-button"
                  onclick="openWidget('${escapeAttribute(company.id || "")}')"
                >
                  Widget
                </button>

              </td>

            `;


            table.appendChild(
              row
            );

          }
        );


      } catch (error) {

        console.error(
          "LOAD COMPANIES ERROR:",
          error
        );


        table.innerHTML = `

          <tr>

            <td
              colspan="6"
              class="empty"
            >
              Gagal mengambil data company.
              <br><br>
              ${escapeHtml(
                error.message
              )}
            </td>

          </tr>

        `;

      }

    }


    /*
    ========================================
    HTML SECURITY
    ========================================
    */

    function escapeHtml(value) {

      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    function escapeAttribute(value) {

      return String(value)
        .replace(
          /\\/g,
          "\\\\"
        )
        .replace(
          /'/g,
          "\\'"
        );

    }


    /*
    ========================================
    START
    ========================================
    */

    loadCompanies();

  </script>


</body>

</html>
