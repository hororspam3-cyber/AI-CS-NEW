<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI-CS New - Dashboard Company</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111827;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 240px;
      background: #111827;
      color: white;
      padding: 25px 18px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 35px;
    }

    .menu {
      display: block;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 8px;
      color: #d1d5db;
      text-decoration: none;
    }

    .menu.active {
      background: #374151;
      color: white;
    }

    .main {
      margin-left: 240px;
      padding: 30px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      gap: 20px;
    }

    .top h1 {
      margin: 0;
      font-size: 25px;
    }

    .top p {
      color: #6b7280;
    }

    .company-button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .card-title {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 25px;
      font-weight: bold;
    }

    .section {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
      margin-bottom: 25px;
    }

    .section h2 {
      margin-top: 0;
      font-size: 18px;
    }

    .form {
      display: none;
    }

    .form.show {
      display: block;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: bold;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }

    .form-group input:focus {
      border-color: #111827;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      padding: 11px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-test {
      background: #2563eb;
      color: white;
    }

    .btn-save {
      background: #16a34a;
      color: white;
    }

    .btn-cancel {
      background: #e5e7eb;
      color: #111827;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .result {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-size: 14px;
    }

    .result.show {
      display: block;
    }

    .result.success {
      background: #dcfce7;
      color: #166534;
    }

    .result.error {
      background: #fee2e2;
      color: #991b1b;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 14px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
    }

    th {
      color: #6b7280;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #dcfce7;
      color: #166534;
      font-size: 12px;
    }

    .widget-status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 12px;
    }

    .empty {
      text-align: center;
      padding: 35px;
      color: #6b7280;
    }

    @media (max-width: 800px) {
      .sidebar {
        position: static;
        width: 100%;
        height: auto;
      }

      .main {
        margin-left: 0;
        padding: 20px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .top {
        align-items: flex-start;
        flex-direction: column;
      }

      .section {
        overflow-x: auto;
      }

      table {
        min-width: 650px;
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar">

    <div class="logo">
      🤖 AI-CS New
    </div>

    <a href="#" class="menu active">
      Dashboard
    </a>

    <a href="#" class="menu">
      Companies
    </a>

    <a href="#" class="menu">
      Widget
    </a>

    <a href="#" class="menu">
      API
    </a>

  </aside>

  <main class="main">

    <div class="top">

      <div>
        <h1>
          Dashboard Company
        </h1>

        <p>
          Kelola perusahaan yang menggunakan AI Customer Service.
        </p>
      </div>

      <button
        class="company-button"
        type="button"
        onclick="showAddCompany()"
      >
        + Tambah Company
      </button>

    </div>

    <!-- FORM TAMBAH COMPANY -->

    <div
      class="section form"
      id="companyForm"
    >

      <h2>
        Tambah Company
      </h2>

      <div class="form-group">

        <label for="companyId">
          Company ID
        </label>

        <input
          id="companyId"
          type="text"
          placeholder="Contoh: ABC001"
        >

      </div>

      <div class="form-group">

        <label for="companyName">
          Nama Perusahaan
        </label>

        <input
          id="companyName"
          type="text"
          placeholder="Contoh: ABC Company"
        >

      </div>

      <div class="form-group">

        <label for="apiUrl">
          API URL Customer
        </label>

        <input
          id="apiUrl"
          type="text"
          placeholder="Contoh: https://api.perusahaan.com/customer"
        >

      </div>

      <div class="form-group">

        <label for="apiKeyEnv">
          API Key Environment
        </label>

        <input
          id="apiKeyEnv"
          type="text"
          placeholder="Contoh: ABC001_API_KEY"
        >

      </div>

      <div class="form-actions">

        <button
          class="btn btn-test"
          id="testButton"
          type="button"
          onclick="testConnection()"
        >
          Test Connection
        </button>

        <button
          class="btn btn-save"
          id="saveButton"
          type="button"
          onclick="saveCompany()"
          disabled
        >
          Simpan Company
        </button>

        <button
          class="btn btn-cancel"
          type="button"
          onclick="hideAddCompany()"
        >
          Batal
        </button>

      </div>

      <div
        class="result"
        id="formResult"
      ></div>

    </div>

    <!-- STATISTICS -->

    <div class="cards">

      <div class="card">

        <div class="card-title">
          Total Company
        </div>

        <div
          class="card-value"
          id="totalCompany"
        >
          0
        </div>

      </div>

      <div class="card">

        <div class="card-title">
          Company Aktif
        </div>

        <div
          class="card-value"
          id="activeCompany"
        >
          0
        </div>

      </div>

      <div class="card">

        <div class="card-title">
          Widget Aktif
        </div>

        <div
          class="card-value"
          id="activeWidget"
        >
          0
        </div>

      </div>

    </div>

    <!-- COMPANY TABLE -->

    <div class="section">

      <h2>
        Daftar Company
      </h2>

      <table>

        <thead>

          <tr>

            <th>
              Company ID
            </th>

            <th>
              Nama
            </th>

            <th>
              API URL
            </th>

            <th>
              Status
            </th>

            <th>
              Widget
            </th>

          </tr>

        </thead>

        <tbody id="companyTable">

          <tr>

            <td
              colspan="5"
              class="empty"
            >
              Belum ada data company.
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </main>

  <script>

    /*
    ========================================
    DATA COMPANY
    ========================================
    */

    const companies = [

      {
        id:
          "CLIENT001",

        name:
          "Client Demo",

        apiUrl:
          "/api/client-demo/customer",

        status:
          "Aktif",

        widget:
          "Aktif"
      }

    ];


    /*
    ========================================
    BUKA FORM
    ========================================
    */

    function showAddCompany() {

      document
        .getElementById("companyForm")
        .classList.add("show");

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /*
    ========================================
    TUTUP FORM
    ========================================
    */

    function hideAddCompany() {

      document
        .getElementById("companyForm")
        .classList.remove("show");

      clearForm();

    }


    /*
    ========================================
    CLEAR FORM
    ========================================
    */

    function clearForm() {

      document.getElementById(
        "companyId"
      ).value = "";

      document.getElementById(
        "companyName"
      ).value = "";

      document.getElementById(
        "apiUrl"
      ).value = "";

      document.getElementById(
        "apiKeyEnv"
      ).value = "";

      document.getElementById(
        "saveButton"
      ).disabled = true;

      hideResult();

    }


    /*
    ========================================
    HASIL TEST
    ========================================
    */

    function showResult(
      message,
      success
    ) {

      const result =
        document.getElementById(
          "formResult"
        );

      result.textContent =
        message;

      result.className =
        "result show " +
        (
          success
            ? "success"
            : "error"
        );

    }


    function hideResult() {

      const result =
        document.getElementById(
          "formResult"
        );

      result.className =
        "result";

      result.textContent =
        "";

    }


    /*
    ========================================
    TEST CONNECTION
    ========================================
    */

    async function testConnection() {

      const companyId =
        document.getElementById(
          "companyId"
        ).value
          .trim()
          .toUpperCase();

      const companyName =
        document.getElementById(
          "companyName"
        ).value
          .trim();

      const apiUrl =
        document.getElementById(
          "apiUrl"
        ).value
          .trim();

      const apiKeyEnv =
        document.getElementById(
          "apiKeyEnv"
        ).value
          .trim()
          .toUpperCase();


      if (
        !companyId ||
        !companyName ||
        !apiUrl ||
        !apiKeyEnv
      ) {

        showResult(
          "Semua data harus diisi terlebih dahulu.",
          false
        );

        return;
      }


      const button =
        document.getElementById(
          "testButton"
        );

      button.disabled =
        true;

      button.textContent =
        "Testing...";


      hideResult();


      try {

        /*
        ----------------------------------------
        TEST COMPANY YANG SUDAH ADA
        ----------------------------------------
        */

        const response =
          await fetch(
            "/api/company/" +
            encodeURIComponent(
              companyId
            )
          );


        const data =
          await response.json();


        /*
        ----------------------------------------
        JIKA COMPANY SUDAH ADA
        ----------------------------------------
        */

        if (
          response.ok &&
          data.success
        ) {

          showResult(
            "Company ditemukan. API URL dan konfigurasi company terbaca.",
            true
          );

          document.getElementById(
            "saveButton"
          ).disabled = false;

          return;
        }


        /*
        ----------------------------------------
        COMPANY BELUM ADA
        ----------------------------------------
        */

        showResult(
          "Data valid. Company ID belum terdaftar dan siap disimpan.",
          true
        );

        document.getElementById(
          "saveButton"
        ).disabled = false;

      } catch (error) {

        showResult(
          "Tidak dapat terhubung ke server AI-CS New.",
          false
        );

      } finally {

        button.disabled =
          false;

        button.textContent =
          "Test Connection";

      }

    }


    /*
    ========================================
    SIMPAN COMPANY
    ========================================
    */

    async function saveCompany() {

      const companyId =
        document.getElementById(
          "companyId"
        ).value
          .trim()
          .toUpperCase();

      const companyName =
        document.getElementById(
          "companyName"
        ).value
          .trim();

      const apiUrl =
        document.getElementById(
          "apiUrl"
        ).value
          .trim();

      const apiKeyEnv =
        document.getElementById(
          "apiKeyEnv"
        ).value
          .trim()
          .toUpperCase();


      if (
        !companyId ||
        !companyName ||
        !apiUrl ||
        !apiKeyEnv
      ) {

        showResult(
          "Data company belum lengkap.",
          false
        );

        return;
      }


      const saveButton =
        document.getElementById(
          "saveButton"
        );

      saveButton.disabled =
        true;

      saveButton.textContent =
        "Menyimpan...";


      try {

        const response =
          await fetch(
            "/api/admin/company",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  companyId:
                    companyId,

                  companyName:
                    companyName,

                  apiUrl:
                    apiUrl,

                  apiKeyEnv:
                    apiKeyEnv

                })
            }
          );


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.success
        ) {

          showResult(
            data.message ||
            "Company gagal disimpan.",
            false
          );

          return;
        }


        /*
        ----------------------------------------
        TAMBAHKAN KE TABEL
        ----------------------------------------
        */

        companies.push({

          id:
            companyId,

          name:
            companyName,

          apiUrl:
            apiUrl,

          status:
            "Aktif",

          widget:
            "Belum"

        });


        renderCompanies();


        showResult(
          "Company berhasil didaftarkan.",
          true
        );


        document.getElementById(
          "companyId"
        ).value = "";

        document.getElementById(
          "companyName"
        ).value = "";

        document.getElementById(
          "apiUrl"
        ).value = "";

        document.getElementById(
          "apiKeyEnv"
        ).value = "";

        saveButton.disabled =
          true;

      } catch (error) {

        showResult(
          "Tidak dapat terhubung ke server.",
          false
        );

      } finally {

        saveButton.textContent =
          "Simpan Company";

      }

    }


    /*
    ========================================
    RENDER COMPANY
    ========================================
    */

    function renderCompanies() {

      const table =
        document.getElementById(
          "companyTable"
        );

      const total =
        document.getElementById(
          "totalCompany"
        );

      const active =
        document.getElementById(
          "activeCompany"
        );

      const widget =
        document.getElementById(
          "activeWidget"
        );


      total.textContent =
        companies.length;


      active.textContent =
        companies.filter(
          function(company) {

            return (
              company.status ===
              "Aktif"
            );

          }
        ).length;


      widget.textContent =
        companies.filter(
          function(company) {

            return (
              company.widget ===
              "Aktif"
            );

          }
        ).length;


      table.innerHTML = "";


      companies.forEach(
        function(company) {

          const row =
            document.createElement(
              "tr"
            );


          row.innerHTML = `

            <td>
              ${company.id}
            </td>

            <td>
              ${company.name}
            </td>

            <td>
              ${company.apiUrl}
            </td>

            <td>

              <span class="status">
                ${company.status}
              </span>

            </td>

            <td>

              ${
                company.widget === "Aktif"

                ? `
                  <span class="widget-status">
                    Aktif
                  </span>
                `

                : `
                  <span class="status">
                    Belum
                  </span>
                `
              }

            </td>

          `;


          table.appendChild(
            row
          );

        }
      );

    }


    /*
    ========================================
    START
    ========================================
    */

    renderCompanies();

  </script>

</body>
</html>
