<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AI Customer Service</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    .chat-container {
      max-width: 500px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px;
    }

    .header h2 {
      margin: 0;
      font-size: 20px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 13px;
      color: #d1d5db;
    }

    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 15px;
      max-width: 85%;
      padding: 12px 15px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 14px;
      word-wrap: break-word;
    }

    .ai {
      background: #f0f1f3;
      color: #111827;
    }

    .user {
      background: #111827;
      color: white;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      padding: 12px;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    .input-area input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }

    .input-area button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      cursor: pointer;
    }

    .input-area button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error {
      padding: 20px;
      color: #b91c1c;
      text-align: center;
    }

    .loading {
      opacity: 0.7;
    }
  </style>

</head>

<body>

  <div class="chat-container">

    <div class="header">

      <h2>
        AI Customer Service
      </h2>

      <p id="customerInfo">
        Menghubungkan...
      </p>

    </div>


    <div
      class="messages"
      id="messages"
    >

      <div class="message ai">
        Menghubungkan ke AI Customer Service...
      </div>

    </div>


    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Tulis pesan..."
        autocomplete="off"
        disabled
      >

      <button
        id="sendButton"
        type="button"
        disabled
      >
        Kirim
      </button>

    </div>

  </div>


  <script>

    /*
    ========================================
    KONFIGURASI
    ========================================
    */

    const AI_CS_URL =
      "https://ai-cs-new.onrender.com";


    /*
    ========================================
    AMBIL CUSTOMER DARI URL
    ========================================
    */

    function getCustomerFromUrl() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const companyId =
        String(
          params.get("companyId") || ""
        )
          .trim()
          .toUpperCase();

      const customerId =
        String(
          params.get("customerId") || ""
        )
          .trim()
          .toUpperCase();

      if (
        !companyId ||
        !customerId
      ) {
        return null;
      }

      return {
        companyId:
          companyId,

        customerId:
          customerId
      };
    }


    /*
    ========================================
    ELEMENT
    ========================================
    */

    const messages =
      document.getElementById(
        "messages"
      );

    const customerInfo =
      document.getElementById(
        "customerInfo"
      );

    const input =
      document.getElementById(
        "messageInput"
      );

    const sendButton =
      document.getElementById(
        "sendButton"
      );


    /*
    ========================================
    TAMBAH PESAN
    ========================================
    */

    function addMessage(
      text,
      type
    ) {

      const message =
        document.createElement(
          "div"
        );

      message.className =
        "message " +
        (
          type === "user"
            ? "user"
            : "ai"
        );

      message.textContent =
        String(text || "");

      messages.appendChild(
        message
      );

      messages.scrollTop =
        messages.scrollHeight;

      return message;
    }


    /*
    ========================================
    LOGIN CUSTOMER
    ========================================
    */

    async function loginCustomer() {

      const customerData =
        getCustomerFromUrl();

      if (!customerData) {

        throw new Error(
          "Company ID atau Customer ID tidak ditemukan di URL."
        );

      }


      const response =
        await fetch(
          AI_CS_URL +
          "/api/login",
          {
            method: "POST",

            credentials: "include",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                customerId:
                  customerData.customerId

              })
          }
        );


      let data;

      try {

        data =
          await response.json();

      } catch (error) {

        throw new Error(
          "Response login dari server tidak valid."
        );

      }


      if (
        !response.ok ||
        !data.success
      ) {

        throw new Error(
          data.message ||
          "Login customer gagal."
        );

      }


      return {
        customer:
          data.customer,

        companyId:
          customerData.companyId,

        customerId:
          customerData.customerId
      };
    }


    /*
    ========================================
    START CHAT
    ========================================
    */

    async function startChat() {

      try {

        const result =
          await loginCustomer();


        const customer =
          result.customer;


        customerInfo.textContent =
          "● Online · " +
          customer.name;


        messages.innerHTML = "";


        addMessage(
          "Halo " +
          customer.name +
          ", ada yang bisa saya bantu?",
          "ai"
        );


        input.disabled =
          false;

        sendButton.disabled =
          false;

        input.focus();


        console.log(
          "AI-CS CUSTOMER:",
          {
            companyId:
              result.companyId,

            customerId:
              result.customerId,

            customerName:
              customer.name
          }
        );


      } catch (error) {

        customerInfo.textContent =
          "● Offline";


        messages.innerHTML = "";


        addMessage(
          error.message ||
          "Tidak dapat terhubung ke sistem.",
          "ai"
        );


        console.error(
          "AUTO LOGIN ERROR:",
          error
        );

      }
    }


    /*
    ========================================
    KIRIM PESAN
    ========================================
    */

    async function sendMessage() {

      const message =
        input.value.trim();


      if (!message) {
        return;
      }


      /*
      ========================================
      CUSTOMER MESSAGE
      ========================================
      */

      addMessage(
        message,
        "user"
      );


      input.value = "";

      sendButton.disabled =
        true;


      /*
      ========================================
      LOADING
      ========================================
      */

      const loading =
        addMessage(
          "Sedang mengetik...",
          "ai"
        );

      loading.classList.add(
        "loading"
      );


      try {

        const customerData =
          getCustomerFromUrl();


        if (!customerData) {

          throw new Error(
            "Data customer tidak ditemukan di URL."
          );

        }


        /*
        ========================================
        KIRIM KE AI-CS
        ========================================
        */

        const response =
          await fetch(
            AI_CS_URL +
            "/api/chat",
            {
              method: "POST",

              credentials: "include",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  companyId:
                    customerData.companyId,

                  customerId:
                    customerData.customerId,

                  message:
                    message

                })
            }
          );


        /*
        ========================================
        RESPONSE
        ========================================
        */

        let data;

        try {

          data =
            await response.json();

        } catch (error) {

          throw new Error(
            "Response server tidak valid."
          );

        }


        loading.remove();


        /*
        ========================================
        ERROR
        ========================================
        */

        if (
          !response.ok ||
          !data.success
        ) {

          addMessage(
            data.message ||
            "AI tidak dapat memproses pesan.",
            "ai"
          );

          return;
        }


        /*
        ========================================
        JAWABAN AI
        ========================================
        */

        addMessage(
          data.reply ||
          "AI tidak memberikan jawaban.",
          "ai"
        );


      } catch (error) {

        console.error(
          "CHAT ERROR:",
          error
        );


        loading.classList.remove(
          "loading"
        );


        loading.textContent =
          error.message ||
          "Tidak dapat terhubung ke AI Customer Service.";


        customerInfo.textContent =
          "● Connection error";

      } finally {

        sendButton.disabled =
          false;

        input.focus();

      }
    }


    /*
    ========================================
    TOMBOL KIRIM
    ========================================
    */

    sendButton.addEventListener(
      "click",
      sendMessage
    );


    /*
    ========================================
    ENTER
    ========================================
    */

    input.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /*
    ========================================
    MULAI
    ========================================
    */

    startChat();

  </script>

</body>

</html>
