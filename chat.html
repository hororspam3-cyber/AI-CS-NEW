<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AI Customer Service - Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    .chat-container {
      max-width: 500px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px;
    }

    .header h2 {
      margin: 0;
      font-size: 20px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 13px;
      color: #d1d5db;
    }

    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 15px;
      max-width: 85%;
      padding: 12px 15px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 14px;
    }

    .ai {
      background: #f0f1f3;
      color: #111827;
    }

    .user {
      background: #111827;
      color: white;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      padding: 12px;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    .input-area input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    .input-area button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      cursor: pointer;
    }

    .input-area button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error {
      padding: 20px;
      color: #b91c1c;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <div class="header">

      <h2>
        AI Customer Service
      </h2>

      <p id="customerInfo">
        Menghubungkan...
      </p>

    </div>

    <div
      class="messages"
      id="messages"
    >

      <div class="message ai">
        Menghubungkan ke AI Customer Service...
      </div>

    </div>

    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Tulis pesan..."
        autocomplete="off"
        disabled
      >

      <button
        id="sendButton"
        type="button"
        disabled
      >
        Kirim
      </button>

    </div>

  </div>

  <script>

    /*
    ========================================
    AI-CS NEW
    ========================================
    */

    const AI_CS_URL =
      "https://ai-cs-new.onrender.com";


    /*
    ========================================
    DATA DEMO
    ========================================
    */

    const COMPANY_ID =
      "XYZ001";

    const CUSTOMER_ID =
      "USER001";


    /*
    ========================================
    ELEMENT
    ========================================
    */

    const messages =
      document.getElementById(
        "messages"
      );

    const customerInfo =
      document.getElementById(
        "customerInfo"
      );

    const input =
      document.getElementById(
        "messageInput"
      );

    const sendButton =
      document.getElementById(
        "sendButton"
      );


    /*
    ========================================
    TAMBAH PESAN
    ========================================
    */

    function addMessage(
      text,
      type
    ) {

      const message =
        document.createElement(
          "div"
        );

      message.className =
        "message " +
        (
          type === "user"
            ? "user"
            : "ai"
        );

      message.textContent =
        String(text || "");

      messages.appendChild(
        message
      );

      messages.scrollTop =
        messages.scrollHeight;
    }


    /*
    ========================================
    LOGIN CUSTOMER
    ========================================
    */

    async function loginCustomer() {

      const response =
        await fetch(
          AI_CS_URL +
          "/api/login",
          {
            method: "POST",

            credentials: "include",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                customerId:
                  CUSTOMER_ID

              })
          }
        );


      const data =
        await response.json();


      if (
        !response.ok ||
        !data.success
      ) {

        throw new Error(
          data.message ||
          "Login customer gagal."
        );

      }


      return data.customer;
    }


    /*
    ========================================
    MULAI CHAT
    ========================================
    */

    async function startChat() {

      try {

        const customer =
          await loginCustomer();


        customerInfo.textContent =
          "● Online · " +
          customer.name;


        messages.innerHTML = "";


        addMessage(
          "Halo " +
          customer.name +
          ", ada yang bisa saya bantu?",
          "ai"
        );


        input.disabled =
          false;

        sendButton.disabled =
          false;

        input.focus();


        console.log(
          "AI-CS NEW TEST:",
          {
            companyId:
              COMPANY_ID,

            customerId:
              CUSTOMER_ID
          }
        );


      } catch (error) {

        customerInfo.textContent =
          "● Offline";


        messages.innerHTML = "";


        addMessage(
          error.message ||
          "Tidak dapat terhubung ke AI-CS.",
          "ai"
        );


        console.error(
          "LOGIN ERROR:",
          error
        );

      }

    }


    /*
    ========================================
    KIRIM PESAN
    ========================================
    */

    async function sendMessage() {

      const message =
        input.value.trim();


      if (!message) {
        return;
      }


      addMessage(
        message,
        "user"
      );


      input.value = "";

      sendButton.disabled =
        true;


      const loading =
        document.createElement(
          "div"
        );

      loading.className =
        "message ai";

      loading.textContent =
        "Sedang mengetik...";

      messages.appendChild(
        loading
      );

      messages.scrollTop =
        messages.scrollHeight;


      try {

        /*
        ====================================
        KIRIM KE AI-CS NEW
        ====================================
        */

        const response =
          await fetch(
            AI_CS_URL +
            "/api/chat",
            {
              method: "POST",

              credentials: "include",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  companyId:
                    COMPANY_ID,

                  customerId:
                    CUSTOMER_ID,

                  message:
                    message

                })
            }
          );


        const data =
          await response.json();


        loading.remove();


        /*
        ====================================
        RESPONSE
        ====================================
        */

        if (
          !response.ok ||
          !data.success
        ) {

          addMessage(
            data.message ||
            "AI tidak dapat memproses pesan.",
            "ai"
          );

          return;
        }


        addMessage(
          data.reply ||
          "AI tidak memberikan jawaban.",
          "ai"
        );


      } catch (error) {

        loading.textContent =
          "Tidak dapat terhubung ke AI-CS.";


        console.error(
          "CHAT ERROR:",
          error
        );

      } finally {

        sendButton.disabled =
          false;

        input.focus();

      }

    }


    /*
    ========================================
    BUTTON
    ========================================
    */

    sendButton.addEventListener(
      "click",
      sendMessage
    );


    /*
    ========================================
    ENTER
    ========================================
    */

    input.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /*
    ========================================
    START
    ========================================
    */

    startChat();

  </script>

</body>
</html>
