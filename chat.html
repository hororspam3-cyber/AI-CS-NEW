<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AI Customer Service</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    .chat-container {
      max-width: 500px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px;
    }

    .header h2 {
      margin: 0;
      font-size: 20px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 13px;
      color: #d1d5db;
    }

    .customer-select {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
    }

    .start-button {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: white;
      color: #111827;
      cursor: pointer;
      font-weight: bold;
    }

    .start-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 15px;
      max-width: 85%;
      padding: 12px 15px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 14px;
    }

    .ai {
      background: #f0f1f3;
      color: #111827;
    }

    .user {
      background: #111827;
      color: white;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      padding: 12px;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    .input-area input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    .input-area button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      cursor: pointer;
    }

    .input-area button:disabled {
      opacity: 0.5;
    }

    .error {
      padding: 20px;
      color: #b91c1c;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <div class="header">

      <h2>AI Customer Service</h2>

      <select
        id="customerSelect"
        class="customer-select"
      >
        <option value="USER001">
          Dina - DEMO001
        </option>

        <option value="USER002">
          Andi - XYZ001
        </option>

        <option value="USER003">
          Budi - DEMO001
        </option>

        <option value="USER004">
          Citra - DEMO001
        </option>

        <option value="CUSTOMER001">
          Rina - CLIENT001
        </option>
        </select>

      <button
        id="startButton"
        class="start-button"
        onclick="startChat()"
      >
        Mulai Chat
      </button>

      <p id="customerInfo">
        Silakan pilih customer lalu tekan Mulai Chat.
      </p>

    </div>

    <div
      class="messages"
      id="messages"
    >
      <div class="message ai">
        Silakan pilih customer untuk memulai chat.
      </div>
    </div>

    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Tulis pesan..."
        autocomplete="off"
        disabled
      >

      <button
        id="sendButton"
        onclick="sendMessage()"
        disabled
      >
        Kirim
      </button>

    </div>

  </div>


  <script>

/*
========================================
AUTO CUSTOMER DARI URL
========================================
*/

function getCustomerFromUrl() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const companyId =
    String(
      params.get("companyId") || ""
    )
      .trim()
      .toUpperCase();

  const customerId =
    String(
      params.get("customerId") || ""
    )
      .trim()
      .toUpperCase();

  if (
    !companyId ||
    !customerId
  ) {
    return null;
  }

  return {
    companyId:
      companyId,

    customerId:
      customerId
  };
}

    /*
    ========================================
    LOGIN CUSTOMER
    ========================================
    */

    async function loginDemo() {

      const customerSelect =
        document.getElementById(
          "customerSelect"
        );

      const customerId =
        customerSelect.value;

      const response =
        await fetch(
          "/api/login",
          {
            method: "POST",

            credentials: "include",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                customerId:
                  customerId
              })
          }
        );

      const data =
        await response.json();

      if (
        !response.ok ||
        !data.success
      ) {
        throw new Error(
          data.message ||
          "Login gagal."
        );
      }

      return data.customer;
    }


    /*
    ========================================
    MULAI CHAT
    ========================================
    */

    async function startChat() {

      const messages =
        document.getElementById(
          "messages"
        );

      const customerInfo =
        document.getElementById(
          "customerInfo"
        );

      const startButton =
        document.getElementById(
          "startButton"
        );

      try {

        startButton.disabled = true;

        const urlCustomer =
  getCustomerFromUrl();

let customer;

if (urlCustomer) {

  const response =
    await fetch(
      "/api/login",
      {
        method: "POST",

        credentials: "include",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            customerId:
              urlCustomer.customerId
          })
      }
    );

  const data =
    await response.json();

  if (
    !response.ok ||
    !data.success
  ) {
    throw new Error(
      data.message ||
      "Login customer gagal."
    );
  }

  customer =
    data.customer;

} else {

  customer =
    await loginDemo();

}
        customerInfo.textContent =
          "● Online · " +
          customer.name;

        messages.innerHTML = "";

        const welcome =
          document.createElement(
            "div"
          );

        welcome.className =
          "message ai";

        welcome.textContent =
          "Halo " +
          customer.name +
          ", ada yang bisa saya bantu?";

        messages.appendChild(
          welcome
        );

        document.getElementById(
          "messageInput"
        ).disabled = false;

        document.getElementById(
          "sendButton"
        ).disabled = false;

        document.getElementById(
          "messageInput"
        ).focus();

      } catch (error) {

        startButton.disabled = false;

        customerInfo.textContent =
          "● Offline";

        messages.innerHTML = "";

        const errorMessage =
          document.createElement(
            "div"
          );

        errorMessage.className =
          "error";

        errorMessage.textContent =
          "Tidak dapat terhubung ke sistem.";

        messages.appendChild(
          errorMessage
        );

        console.error(
          "LOGIN ERROR:",
          error
        );
      }
    }


    /*
    ========================================
    KIRIM PESAN
    ========================================
    */

    async function sendMessage() {

      const input =
        document.getElementById(
          "messageInput"
        );

      const button =
        document.getElementById(
          "sendButton"
        );

      const messages =
        document.getElementById(
          "messages"
        );

      const message =
        input.value.trim();

      if (!message) {
        return;
      }

      const userMessage =
        document.createElement(
          "div"
        );

      userMessage.className =
        "message user";

      userMessage.textContent =
        message;

      messages.appendChild(
        userMessage
      );

      input.value = "";

      button.disabled = true;

      const loading =
        document.createElement(
          "div"
        );

      loading.className =
        "message ai";

      loading.textContent =
        "Sedang mengetik...";

      messages.appendChild(
        loading
      );

      messages.scrollTop =
        messages.scrollHeight;

      try {

        const response =
          await fetch(
            "/api/chat",
            {
              method: "POST",

              credentials: "include",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  message:
                    message
                })
            }
          );

        const data =
          await response.json();

        loading.remove();

        const aiMessage =
          document.createElement(
            "div"
          );

        aiMessage.className =
          "message ai";

        aiMessage.textContent =
          data.reply ||
          data.message ||
          "AI tidak memberikan jawaban.";

        messages.appendChild(
          aiMessage
        );

        messages.scrollTop =
          messages.scrollHeight;

      } catch (error) {

        loading.textContent =
          "Tidak dapat terhubung ke AI.";

        console.error(
          "CHAT ERROR:",
          error
        );

      } finally {

        button.disabled = false;

        input.focus();

      }
    }


    /*
    ========================================
    ENTER UNTUK KIRIM
    ========================================
    */

    document
      .getElementById(
        "messageInput"
      )
      .addEventListener(
        "keydown",
        function (event) {

          if (
            event.key === "Enter"
          ) {
            sendMessage();
          }

        }
      );

  </script>

</body>
</html>
