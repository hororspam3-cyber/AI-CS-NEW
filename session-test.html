<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Session Test</title>
</head>

<body>

  <h2>Test Login Dina</h2>

  <button onclick="login()">
    Login Dina
  </button>

  <button onclick="testChat()">
    Test Chat
  </button>

  <pre id="result"></pre>

  <script>

    async function login() {

      const response =
        await fetch(
          "/api/login",
          {
            method: "POST",

            credentials: "include",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              customerId:
                "USER001"
            })
          }
        );

      const data =
        await response.json();

      document.getElementById(
        "result"
      ).textContent =
        JSON.stringify(
          data,
          null,
          2
        );
    }


    async function testChat() {

      const response =
        await fetch(
          "/api/chat",
          {
            method: "POST",

            credentials: "include",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              message:
                "Berapa saldo saya?"
            })
          }
        );

      const data =
        await response.json();

      document.getElementById(
        "result"
      ).textContent =
        JSON.stringify(
          data,
          null,
          2
        );
    }

  </script>

</body>
</html>
