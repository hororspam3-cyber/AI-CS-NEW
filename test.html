<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Customer Service</title>
</head>

<body>

  <h2>AI Customer Service</h2>

  <input
    id="message"
    type="text"
    placeholder="Tulis pertanyaan..."
  >

  <button onclick="sendMessage()">
    Kirim
  </button>

  <pre id="reply"></pre>

  <script>
    async function sendMessage() {
      const message =
        document.getElementById("message").value.trim();

      const reply =
        document.getElementById("reply");

      if (!message) {
        reply.textContent = "Silakan tulis pertanyaan.";
        return;
      }

      reply.textContent = "Menghubungi AI...";

      try {
        const response = await fetch(
          "/api/chat",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              message: message
            })
          }
        );

        const text = await response.text();

        reply.textContent =
          "HTTP " +
          response.status +
          "\n\n" +
          text;

      } catch (error) {
        reply.textContent =
          "FETCH ERROR:\n" +
          error.message;
      }
    }
  </script>

</body>
</html>
