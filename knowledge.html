<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AI-CS New - Knowledge Base</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111827;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 240px;
      background: #111827;
      color: white;
      padding: 25px 18px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 35px;
    }

    .menu {
      display: block;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 8px;
      color: #d1d5db;
      text-decoration: none;
    }

    .menu:hover {
      background: #1f2937;
      color: white;
    }

    .menu.active {
      background: #374151;
      color: white;
    }

    .main {
      margin-left: 240px;
      padding: 30px;
    }

    .top h1 {
      margin: 0;
      font-size: 25px;
    }

    .top p {
      color: #6b7280;
    }

    .section {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
      margin-top: 25px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
    }

    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .button {
      margin-top: 22px;
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      cursor: pointer;
    }

    .button:hover {
      background: #374151;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    @media (max-width: 800px) {

      .sidebar {
        position: static;
        width: 100%;
        height: auto;
      }

      .main {
        margin-left: 0;
      }

    }

  </style>
</head>

<body>

  <aside class="sidebar">

    <div class="logo">
      🤖 AI-CS New
    </div>

    <a
      href="dashboard.html"
      class="menu"
    >
      Dashboard
    </a>

    <a
      href="dashboard.html"
      class="menu"
    >
      Companies
    </a>

    <a
      href="knowledge.html"
      class="menu active"
    >
      Knowledge
    </a>

    <a
      href="widget-generator.html"
      class="menu"
    >
      Widget
    </a>

    <a
      href="#"
      class="menu"
      onclick="alert('API akan kita buat pada tahap berikutnya.'); return false;"
    >
      API
    </a>

  </aside>


  <main class="main">

    <div class="top">

      <h1>
        Knowledge Base
      </h1>

      <p>
        Atur informasi yang boleh digunakan AI untuk setiap perusahaan.
      </p>

    </div>


    <div class="section">

      <label for="companyId">
        Company
      </label>

      <select id="companyId">

        <option value="">
          Memuat company...
        </option>

      </select>


      <label for="faq">
        FAQ
      </label>

      <textarea
        id="faq"
        placeholder="Contoh:
Berapa lama withdrawal?
Bagaimana cara deposit?
Bagaimana cara menghubungi customer service?"
      ></textarea>


      <label for="deposit">
        Aturan Deposit
      </label>

      <textarea
        id="deposit"
        placeholder="Contoh:
Minimal deposit Rp50.000.
Deposit diproses secara otomatis."
      ></textarea>


      <label for="withdrawal">
        Aturan Withdrawal
      </label>

      <textarea
        id="withdrawal"
        placeholder="Contoh:
Withdrawal diproses maksimal 24 jam."
      ></textarea>


      <label for="bonus">
        Aturan Bonus
      </label>

      <textarea
        id="bonus"
        placeholder="Contoh:
Bonus tersedia sesuai ketentuan perusahaan."
      ></textarea>


      <label for="other">
        Informasi Lain
      </label>

      <textarea
        id="other"
        placeholder="Informasi tambahan perusahaan..."
      ></textarea>


      <button
        class="button"
        type="button"
        onclick="saveKnowledge()"
      >
        Simpan Knowledge
      </button>


      <div
        id="message"
        class="message"
      ></div>

    </div>

  </main>


  <script>

    async function loadCompanies() {

      const select =
        document.getElementById("companyId");

      try {

        const response =
          await fetch("/api/companies");

        const data =
          await response.json();

        if (
          !response.ok ||
          !data.success
        ) {
          throw new Error(
            data.message ||
            "Gagal mengambil company."
          );
        }

        const companies =
          data.companies || [];

        select.innerHTML =
          '<option value="">Pilih Company</option>';

        companies.forEach(
          function(company) {

            const option =
              document.createElement("option");

            option.value =
              company.id;

            option.textContent =
              company.id +
              " - " +
              company.name;

            select.appendChild(option);

          }
        );

      } catch (error) {

        select.innerHTML =
          '<option value="">Gagal memuat company</option>';

        showMessage(
          error.message,
          "error"
        );

      }

    }


    async function loadKnowledge() {

      const companyId =
        document.getElementById(
          "companyId"
        ).value;

      if (!companyId) {
        return;
      }

      try {

        const response =
          await fetch(
            "/api/knowledge/" +
            encodeURIComponent(companyId)
          );

        const data =
          await response.json();

        if (
          !response.ok ||
          !data.success
        ) {
          return;
        }

        const knowledge =
          data.knowledge || {};

        document.getElementById("faq").value =
          knowledge.faq || "";

        document.getElementById("deposit").value =
          knowledge.deposit || "";

        document.getElementById("withdrawal").value =
          knowledge.withdrawal || "";

        document.getElementById("bonus").value =
          knowledge.bonus || "";

        document.getElementById("other").value =
          knowledge.other || "";

      } catch (error) {

        console.error(
          "LOAD KNOWLEDGE ERROR:",
          error
        );

      }

    }


    async function saveKnowledge() {

      const companyId =
        document.getElementById(
          "companyId"
        ).value;

      if (!companyId) {

        showMessage(
          "Pilih Company terlebih dahulu.",
          "error"
        );

        return;
      }

      const knowledge = {

        faq:
          document.getElementById(
            "faq"
          ).value.trim(),

        deposit:
          document.getElementById(
            "deposit"
          ).value.trim(),

        withdrawal:
          document.getElementById(
            "withdrawal"
          ).value.trim(),

        bonus:
          document.getElementById(
            "bonus"
          ).value.trim(),

        other:
          document.getElementById(
            "other"
          ).value.trim()

      };


      try {

        const response =
          await fetch(
            "/api/knowledge/" +
            encodeURIComponent(companyId),
            {
              method: "PUT",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(knowledge)
            }
          );

        const data =
          await response.json();

        if (
          !response.ok ||
          !data.success
        ) {

          throw new Error(
            data.message ||
            "Gagal menyimpan knowledge."
          );

        }

        showMessage(
          "Knowledge berhasil disimpan untuk " +
          companyId +
          ".",
          "success"
        );

      } catch (error) {

        console.error(
          "SAVE KNOWLEDGE ERROR:",
          error
        );

        showMessage(
          error.message,
          "error"
        );

      }

    }


    function showMessage(
      text,
      type
    ) {

      const message =
        document.getElementById(
          "message"
        );

      message.textContent =
        text;

      message.className =
        "message " +
        type;

    }


    document.getElementById(
      "companyId"
    ).addEventListener(
      "change",
      loadKnowledge
    );


    loadCompanies();

  </script>

</body>

</html>
