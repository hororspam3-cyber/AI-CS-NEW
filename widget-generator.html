<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AI-CS New - Widget Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px;

      font-family: Arial, sans-serif;

      background: #f4f6f8;
    }

    .container {
      max-width: 700px;

      margin: auto;

      background: white;

      padding: 30px;

      border-radius: 15px;

      box-shadow:
        0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    label {
      display: block;

      margin-top: 20px;

      margin-bottom: 8px;

      font-weight: bold;
    }

    input {
      width: 100%;

      padding: 12px;

      border:
        1px solid #ccc;

      border-radius: 8px;

      font-size: 15px;

      outline: none;
    }

    button {
      margin-top: 20px;

      padding: 12px 18px;

      border: none;

      border-radius: 8px;

      background: #111827;

      color: white;

      font-size: 15px;

      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    textarea {
      width: 100%;

      min-height: 150px;

      margin-top: 15px;

      padding: 12px;

      border:
        1px solid #ccc;

      border-radius: 8px;

      font-family:
        monospace;

      font-size: 13px;

      resize: vertical;
    }

    .result {
      display: none;

      margin-top: 30px;
    }

    .success {
      margin-top: 15px;

      padding: 12px;

      border-radius: 8px;

      background: #dcfce7;

      color: #166534;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>
      AI-CS New
    </h1>

    <p>
      Buat kode Live Chat untuk perusahaan.
    </p>

    <label>
      Company ID
    </label>

    <input
      id="companyId"
      type="text"
      placeholder="Contoh: CLIENT001"
      autocomplete="off"
    >

    <button
      type="button"
      onclick="generateWidget()"
    >
      Generate Widget
    </button>

    <div
      id="result"
      class="result"
    >

      <div class="success">
        Kode widget berhasil dibuat.
      </div>

      <label>
        Kode Widget
      </label>

      <textarea
        id="widgetCode"
        readonly
      ></textarea>

      <button
        type="button"
        onclick="copyWidget()"
      >
        Copy Kode
      </button>

    </div>

  </div>


  <script>

    function generateWidget() {

      const input =
        document.getElementById(
          "companyId"
        );

      const result =
        document.getElementById(
          "result"
        );

      const widgetCode =
        document.getElementById(
          "widgetCode"
        );

      const companyId =
        String(
          input.value || ""
        )
          .trim()
          .toUpperCase();


      if (!companyId) {

        alert(
          "Company ID wajib diisi."
        );

        return;
      }


      widgetCode.value =
`<script>
window.currentCustomer = {
  id: "CUSTOMER_ID"
};
<\/script>

<script
  src="https://ai-cs-new.onrender.com/widget.js"
  data-company-id="${companyId}"
><\/script>`;


      result.style.display =
        "block";
    }


    async function copyWidget() {

      const widgetCode =
        document.getElementById(
          "widgetCode"
        );

      try {

        await navigator.clipboard.writeText(
          widgetCode.value
        );

        alert(
          "Kode widget berhasil disalin."
        );

      } catch (error) {

        widgetCode.select();

        document.execCommand(
          "copy"
        );

        alert(
          "Kode widget berhasil disalin."
        );
      }
    }

  </script>

</body>
</html>
